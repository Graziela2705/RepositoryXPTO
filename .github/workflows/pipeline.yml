name: Primeiro pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 

jobs:
  sonarqube: 
    name:  SonarQube 
    runs-on:  windows-latest 
    steps: 
      - uses:  actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 
        with: 
          fetch-depth:  0   # Shallow clones should be disabled for a better relevancy of analysis 
      - name:  SonarQube  Scan 
        uses:  SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0 
        env: 
          SONAR_TOKEN:  ${{  secrets.SONAR_TOKEN  }}

  testesoma:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest,macos-latest]
        python-version: ['3.12', '3.11', '3.10']
    runs-on: ${{ matrix.os }}


    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_soma.py

  testesubtracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_sub.py

  testemultiplicacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_mult.py

  testedivisao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_div.py

  deploy:
    needs: [testesoma, testesubtracao, testemultiplicacao, testedivisao]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"

        
                