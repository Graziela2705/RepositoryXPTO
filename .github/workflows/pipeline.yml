name: Primeiro pipeline

on:
 workflow_dispatch:
 

jobs:
  testesoma:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest,macos-latest]
        python-version: [3.12, 3.11, 3.10]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov

      - name: Análise de Código
        run: python -m flake8 Test_PY

      - name: Testes Unitários
        run: pytest --cov=app.py --cov-report=xml

  

  testesubtracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install pytest

      - name: Execução de Testes
        run: pytest Test_PY/test_sub.py

  testemultiplicacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install pytest

      - name: Execução de Testes
        run: pytest Test_PY/test_mult.py

  testedivisao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install pytest

      - name: Execução de Testes
        run: pytest Test_PY/test_div.py

  deploy:
    needs: [testesoma, testesubtracao, testemultiplicacao, testedivisao]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"

        
                