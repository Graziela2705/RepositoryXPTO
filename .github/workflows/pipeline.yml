name: Primeiro pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 

jobs:

  testesoma:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest,macos-latest]
        python-version: [3.12, 3.11, 3.10]
    runs-on: ${{ matrix.os }}


    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_soma.py

  testesubtracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_sub.py

  testemultiplicacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_mult.py

  testedivisao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Execução de Testes
        run: pytest Test_PY/test_div.py

  deploy:
    needs: [testesoma, testesubtracao, testemultiplicacao, testedivisao]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"

        
                